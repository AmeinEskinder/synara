name: Qualify PR 1823 Linux package formats

on:
  push:
    branches: [cleanup/20261011/linux-formats-1367-evidence]
    paths:
      - .github/workflows/linux-formats-qualification.yml
      - .github/scripts/linux-formats-qualification.mjs
      - .github/scripts/rpm-install-integrity.mjs
      - .github/scripts/rpm-install-integrity.test.mjs

permissions:
  contents: read

concurrency:
  group: linux-formats-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-formats:
    name: Build AppImage, Deb and RPM; verify actual installed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LINUX_FORMATS_QUALIFICATION_SOURCE_SHA: 3af35fb285e796b425ede511f09b2f656b7835ed
      LINUX_FORMATS_QUALIFICATION_DRIVER_SHA: ${{ github.sha }}
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SYNARA_DESKTOP_SIGNED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SYNARA_DISABLE_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Checkout immutable qualification driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Checkout exact feature source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LINUX_FORMATS_QUALIFICATION_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/package.json
      - name: Record and verify source and driver provenance
        run: node ../driver/.github/scripts/linux-formats-qualification.mjs prepare "$PWD" "$RUNNER_TEMP/linux-formats-evidence"
      - name: Check conditional RPM permission verification rejects other mismatches
        run: |
          set -euo pipefail
          node --test ../driver/.github/scripts/rpm-install-integrity.test.mjs 2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/rpm-integrity-tests.log"
      - name: Install pinned native toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          deb_rust_version=$(node -p 'require("./packages/shared/src/cuaDriverRelease.json").rustVersion')
          rustup toolchain install "$deb_rust_version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$deb_rust_version" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libx11-dev libxtst-dev libxrandr-dev libxfixes-dev libxrender-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libsecret-1-0 libcrypt1 xz-utils dpkg-dev rpm rpm2cpio cpio
      - name: Install frozen production build dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing' 2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/install-build-dependencies.log"
      - name: Build AppImage, Debian and RPM packages together once
        id: build
        timeout-minutes: 35
        run: |
          set -euo pipefail
          deb_build_version=$(node -p 'require("./apps/server/package.json").version')
          deb_lock_sha=$(sha256sum bun.lock | cut -d ' ' -f 1)
          bun run dist:desktop:artifact -- \
            --platform linux --target AppImage,deb,rpm --arch x64 --flavor production \
            --build-version "$deb_build_version" \
            --source-commit "$LINUX_FORMATS_QUALIFICATION_SOURCE_SHA" --lockfile-sha256 "$deb_lock_sha" \
            --keep-stage --verbose --output-dir "$RUNNER_TEMP/linux-formats-packages" \
            2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/build.log"
      - name: Inspect real package metadata and retain payload hashes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node ../driver/.github/scripts/linux-formats-qualification.mjs inspect "$PWD" "$RUNNER_TEMP/linux-formats-evidence"
      - name: Verify all three declared artifact formats and updater provenance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          deb_build_version=$(node -p 'require("./apps/server/package.json").version')
          deb_lock_sha=$(sha256sum bun.lock | cut -d ' ' -f 1)
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir "$RUNNER_TEMP/linux-formats-packages" --platform linux --arch x64 \
            --target AppImage,deb,rpm --version "$deb_build_version" \
            --source-commit "$LINUX_FORMATS_QUALIFICATION_SOURCE_SHA" --source-tag "" \
            --lockfile-sha256 "$deb_lock_sha" --publication false --signed false \
            --allow-unsigned-windows-publication false \
            2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/artifact-provenance.log"
          cp "$RUNNER_TEMP/linux-formats-packages"/artifact-*.provenance.json "$RUNNER_TEMP/linux-formats-evidence/"
      - name: Preserve canonical AppImage, Debian and RPM startup and runtime checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          deb_build_version=$(node -p 'require("./apps/server/package.json").version')
          node scripts/verify-packaged-desktop-startup.ts \
            --assets-dir "$RUNNER_TEMP/linux-formats-packages" --platform linux --arch x64 --target AppImage,deb,rpm \
            --version "$deb_build_version" 2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/extracted-packages-startup.log"
      - name: Install Debian, verify the installed runtime, and check removal preserves data
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node ../driver/.github/scripts/linux-formats-qualification.mjs verify-deb "$PWD" "$RUNNER_TEMP/linux-formats-evidence"
      - name: Install RPM in disposable Fedora 43 and preserve the same startup assertions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          docker pull fedora:43 2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/fedora-pull.log"
          docker image inspect fedora:43 > "$RUNNER_TEMP/linux-formats-evidence/fedora-image.json"
          qualification_node=$(command -v node)
          docker run --rm --name "synara-rpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$PWD/../driver,dst=$(realpath ../driver),readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/linux-formats-packages,dst=$RUNNER_TEMP/linux-formats-packages,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/linux-formats-evidence,dst=$RUNNER_TEMP/linux-formats-evidence" \
            --mount "type=bind,src=$(dirname "$qualification_node"),dst=/qualification-node,readonly" \
            --env GITHUB_ACTIONS=true --env RUNNER_ENVIRONMENT=github-hosted \
            --env LINUX_FORMATS_QUALIFICATION_SOURCE_SHA --env LINUX_FORMATS_QUALIFICATION_DRIVER_SHA \
            --env SYNARA_DISABLE_AUTO_UPDATE=1 --env LINUX_FORMATS_EVIDENCE_DIR="$RUNNER_TEMP/linux-formats-evidence" --workdir "$PWD" \
            fedora:43 /bin/bash -euo pipefail -c '
              dnf install -y git xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 alsa-lib mesa-libgbm libsecret libxkbfile liberation-fonts procps-ng
              command -v xvfb-run
              git config --global --add safe.directory "$PWD"
              git config --global --add safe.directory "$(realpath ../driver)"
              /qualification-node/node "../driver/.github/scripts/linux-formats-qualification.mjs" verify-rpm "$PWD" "$LINUX_FORMATS_EVIDENCE_DIR"
            ' 2>&1 | tee "$RUNNER_TEMP/linux-formats-evidence/fedora-container.log"
      - name: Clean up the disposable container
        if: always()
        run: |
          if docker container inspect "synara-rpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1; then
            docker rm --force "synara-rpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-formats-${{ env.LINUX_FORMATS_QUALIFICATION_SOURCE_SHA }}-driver-${{ github.sha }}
          path: ${{ runner.temp }}/linux-formats-evidence
          retention-days: 14
          if-no-files-found: error
