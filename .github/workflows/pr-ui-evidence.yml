name: Rail selection motion evidence

on:
  push:
    branches:
      - cleanup/20261011/rail-motion-evidence
    paths:
      - .github/workflows/pr-ui-evidence.yml
      - scripts/pr-ui-evidence/**

permissions:
  contents: read

concurrency:
  group: pr-ui-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: targets
        run: node scripts/pr-ui-evidence/runner.mjs matrix

  capture:
    name: ${{ matrix.kind == 'control' && 'Author defect control' || 'Evidence' }} ${{ matrix.id }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false

      - name: Checkout reviewed evidence driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .pr-ui-evidence-driver
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: ${{ matrix.kind == 'native' && 'true' || 'false' }}

      - name: Configure Electron sandbox helper
        if: matrix.kind == 'native'
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { dirname, join } = require('node:path');
          const helper = join(dirname(require('./apps/desktop/node_modules/electron')), 'chrome-sandbox');
          execFileSync('sudo', ['chown', 'root:root', helper], { stdio: 'inherit' });
          execFileSync('sudo', ['chmod', '4755', helper], { stdio: 'inherit' });
          NODE

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install browser runtime
        timeout-minutes: 10
        run: ./apps/web/node_modules/.bin/playwright install chromium ffmpeg

      - name: Prepare isolated capture fixture and provenance
        env:
          PR_UI_EVIDENCE_ID: ${{ matrix.id }}
          PR_UI_EVIDENCE_SOURCE: ${{ matrix.source }}
        run: node .pr-ui-evidence-driver/scripts/pr-ui-evidence/runner.mjs prepare

      - name: Capture actual browser UI
        if: matrix.kind == 'web'
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          set -o pipefail
          for motion_mode in no-preference reduce; do
            VITE_PR_UI_MOTION_MODE="$motion_mode" bunx vitest run --config vitest.pr-ui-evidence.config.ts 2>&1 | tee "$VITE_PR_UI_EVIDENCE_DIR/$motion_mode.log"
          done

      - name: Capture actual native browser UI
        if: matrix.kind == 'native'
        timeout-minutes: 10
        working-directory: apps/web
        run: xvfb-run -a bun e2e/evidence/captureNativeUi.mjs

      - name: Run actual author-head defect control once
        if: matrix.kind == 'control'
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          set +e
          bunx vitest run --config vitest.pr-ui-evidence.config.ts 2>&1 | tee "$VITE_PR_UI_EVIDENCE_DIR/vitest.log"
          control_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${control_status[0]}" > "$VITE_PR_UI_EVIDENCE_DIR/vitest-exit-code.txt"
          printf '%s\n' "${control_status[1]}" > "$VITE_PR_UI_EVIDENCE_DIR/log-exit-code.txt"
          if [ "${control_status[0]}" -ne 0 ]; then
            exit "${control_status[0]}"
          fi
          exit "${control_status[1]}"

      - name: Verify captured files and unchanged application source
        if: success() || (failure() && matrix.kind == 'control')
        run: node .pr-ui-evidence-driver/scripts/pr-ui-evidence/runner.mjs verify

      - name: Upload source-labelled screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-ui-evidence-${{ matrix.id }}-${{ matrix.source }}
          path: .pr-ui-evidence-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
