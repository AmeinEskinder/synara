name: PR UI evidence

on:
  push:
    branches:
      - cleanup/20261010/ui-evidence
    paths:
      - .github/workflows/pr-ui-evidence.yml
      - scripts/pr-ui-evidence/**

permissions:
  contents: read

concurrency:
  group: pr-ui-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: targets
        run: node scripts/pr-ui-evidence/runner.mjs matrix

  capture:
    name: Evidence ${{ matrix.id }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false

      - name: Checkout reviewed evidence driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .pr-ui-evidence-driver
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install browser runtime
        timeout-minutes: 10
        run: ./apps/web/node_modules/.bin/playwright install chromium

      - name: Prepare isolated capture fixture and provenance
        env:
          PR_UI_EVIDENCE_ID: ${{ matrix.id }}
          PR_UI_EVIDENCE_SOURCE: ${{ matrix.source }}
        run: node .pr-ui-evidence-driver/scripts/pr-ui-evidence/runner.mjs prepare

      - name: Capture actual browser UI
        timeout-minutes: 10
        working-directory: apps/web
        run: bunx vitest run --config vitest.pr-ui-evidence.config.ts

      - name: Verify captured files and unchanged application source
        run: node .pr-ui-evidence-driver/scripts/pr-ui-evidence/runner.mjs verify

      - name: Upload source-labelled screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-ui-evidence-${{ matrix.id }}-${{ matrix.source }}
          path: .pr-ui-evidence-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
